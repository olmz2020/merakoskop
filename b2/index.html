<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1C1B19">
<title>Merakoskop · YouTube</title>
<meta property="og:title" content="Merakoskop — Tarihin en tuhaf merakları">
<meta property="og:description" content="Videoyu YouTube uygulamasında izle.">
<meta property="og:image" content="https://olmz2020.github.io/merakoskop/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 1000'%3E%3Ccircle cx='500' cy='500' r='500' fill='%23D33A22'/%3E%3C/svg%3E">
<style>
:root{--bg:#1C1B19;--fg:#EFE6D2;--red:#D33A22;--yel:#FFD23F;--mut:#A9A08E;--line:#4A463F}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px 20px;text-align:center}
.logo{width:92px;height:92px}
h1{font-size:22px;margin:4px 0 0;font-weight:800}
p{margin:0;color:var(--mut);font-size:15px;line-height:1.45;max-width:340px}
.btn{display:block;width:100%;max-width:340px;padding:16px 18px;border-radius:14px;font-weight:800;font-size:17px;text-decoration:none}
.p{background:var(--red);color:#fff}
.s{color:var(--fg);border:1.5px solid var(--line)}
b{color:var(--fg)}
[hidden]{display:none!important}
pre{white-space:pre-wrap;word-break:break-all;text-align:left;font-size:12px;color:var(--yel);max-width:640px;margin:0}
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 1000 1000" aria-hidden="true"><circle cx="500" cy="500" r="500" fill="#D33A22"/><g transform="translate(-48,34)"><polygon points="236,740 236,260 352,260 480,470 592,278 688,336 480,670 348,460 348,740" fill="#EFE6D2"/><path d="M609 358 L640 307 C700 210 830 225 828 345 C826 430 722 455 702 525 L702 585" fill="none" stroke="#EFE6D2" stroke-width="112"/><circle cx="702" cy="700" r="58" fill="#EFE6D2"/></g></svg>
  <h1>YouTube'da açılıyor…</h1>
  <p>Merakoskop videosu YouTube uygulamasında açılacak.</p>
  <a id="app" class="btn p" href="https://www.youtube.com/@merakoskop">YouTube uygulamasında aç ▶</a>
  <a id="safari" class="btn s" href="#" hidden>Safari'de aç</a>
  <a id="web" class="btn s" href="https://www.youtube.com/@merakoskop">Tarayıcıda izle</a>
  <p id="iosnot" hidden>Açılmazsa sağ üstteki <b>⋯</b> menüsünden <b>“Tarayıcıda aç”</b> seçeneğine dokun.</p>
  <pre id="debug" hidden></pre>
</main>
<script>
(function () {
  // Kısa bağlantılar: <alan>/<anahtar>  ya da  <alan>/?k=<anahtar>  |  doğrudan: ?v=<video id>  ?s=<shorts id>
  var KANAL = "@merakoskop";
  var LINKS = {
    "":      { t: "kanal" },
    "kanal": { t: "kanal" },
    "abone": { t: "kanal", abone: true },
    "b1":    { t: "video", id: "R2-0p4xiPtU" },  // Avrupalılar Neden Yıkanmazdı? (belgesel 1)
    "k1":    { t: "short", id: "MnfkLaqq80E" },  // 1700'lerde Paris'te Bu Sesi Duyarsan Hemen Kaç!
    "k2":    { t: "short", id: "NnxrwgD5PjE" },  // Versay Sarayı'nda Tuvalet Yoktu!
    "k3":    { t: "short", id: "XEOUj9Ql43U" },  // Avrupa'da Doktorlar Yıkanmayı Yasakladı!
    "b2":    { t: "video", id: "gGupV3R1Tug" },  // Doktorlar Neden İnsan Tozu İçirdi? (belgesel 2, 14 Eki 2026; 22 Eki'den beri gizli)
    "u1":    { t: "video", id: "QfjkIp3doaI" },  // UZUN 01 · Güneş Sistemi Ailesi (22 Eki 2026)
    "y10":   { t: "short", id: "SCVv9sQOWxM" }   // Ya Bir Gün…? #10 Güneş Kime Göz Kırptı?
  };
  var ID_OK = /^[A-Za-z0-9_-]{6,20}$/;

  var q = new URLSearchParams(location.search);
  var slug = (q.get("k") || location.pathname.replace(/^\/+|\/+$/g, "").split("/").pop() || "").toLowerCase();
  if (/\.html?$/.test(slug)) slug = "";
  var hedef;
  if (ID_OK.test(q.get("v") || "")) hedef = { t: "video", id: q.get("v") };
  else if (ID_OK.test(q.get("s") || "")) hedef = { t: "short", id: q.get("s") };
  else hedef = LINKS[slug] || LINKS[""];

  var yol = hedef.t === "video" ? "www.youtube.com/watch?v=" + hedef.id
          : hedef.t === "short" ? "www.youtube.com/shorts/" + hedef.id
          : "www.youtube.com/" + KANAL + (hedef.abone ? "?sub_confirmation=1" : "");
  var web = "https://" + yol;

  var ua = navigator.userAgent || "";
  var android = /Android/i.test(ua);
  var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var uygulamaIci = /Instagram|FBAN|FBAV|FB_IAB|Barcelona|musical_ly|BytedanceWebview|TikTok|Snapchat|Line\//i.test(ua);

  // Android: intent ile doğrudan YouTube uygulaması; uygulama yoksa tarayıcıya düşer.
  // iOS: youtube:// şeması (Instagram tarayıcısında otomatik deneme engellenebilir → butonlar).
  var app = android ? "intent://" + yol + "#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=" + encodeURIComponent(web) + ";end"
          : ios ? "youtube://" + yol
          : web;

  document.getElementById("app").href = app;
  document.getElementById("web").href = web;
  if (ios && uygulamaIci) {
    var s = document.getElementById("safari");
    s.href = "x-safari-https://" + yol;   // Instagram tarayıcısından Safari'ye çıkış
    s.hidden = false;
    document.getElementById("iosnot").hidden = false;
  }

  var karar = { slug: slug, hedef: hedef, web: web, app: app, android: android, ios: ios, uygulamaIci: uygulamaIci,
                otomatik: (!android && !ios) ? "web" : (android || uygulamaIci) ? "app" : "yok (buton)" };
  if (q.get("debug") === "1") {
    var d = document.getElementById("debug");
    d.textContent = JSON.stringify(karar, null, 2);
    d.hidden = false;
    return;
  }
  if (!android && !ios) { location.replace(web); return; }        // masaüstü: doğrudan YouTube
  if (android || uygulamaIci) { setTimeout(function () { location.href = app; }, 60); }
})();
</script>
<noscript><p><a class="btn p" href="https://www.youtube.com/@merakoskop">YouTube'da Merakoskop</a></p></noscript>
</body>
</html>
